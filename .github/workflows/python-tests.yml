name: Tests
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}

      # uv with a cached wheel store installs requirements.txt in seconds;
      # plain pip took ~17 s of a ~27 s run.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - run: uv pip install --system -r requirements.txt

      # No -n auto: the whole suite runs in ~0.3 s, and spawning xdist workers
      # measured ~5x slower than running it serially.
      - run: python -m pytest byox_ladder/tests/ --cov=byox_ladder --cov-branch --cov-fail-under=100 -q
